/var/log/jw-meetingmate/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 meetingmate meetingmate
    sharedscripts
    postrotate
        # Signal Gunicorn to reopen log files without dropping connections
        if [ -f /var/run/jw-meetingmate.pid ]; then
            kill -USR1 $(cat /var/run/jw-meetingmate.pid) 2>/dev/null || true
        fi
    endscript
}
